name: Sociam Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --org com.sociam.app .
          fi

      - name: Configure Android permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")

          if not manifest.exists():
              raise SystemExit("AndroidManifest.xml not found")

          text = manifest.read_text()

          permissions = [
              '<uses-permission android:name="android.permission.INTERNET"/>',
              '<uses-permission android:name="android.permission.CAMERA"/>',
              '<uses-permission android:name="android.permission.RECORD_AUDIO"/>',
              '<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>',
              '<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>',
              '<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>',
              '<uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>',
              '<uses-permission android:name="android.permission.READ_MEDIA_VIDEO"/>',
              '<uses-permission android:name="android.permission.READ_MEDIA_VISUAL_USER_SELECTED"/>',
          ]

          missing = [
              p for p in permissions
              if p.split('android:name="')[1].split('"')[0] not in text
          ]

          if missing:
              marker = text.find(">")
              if marker == -1:
                  raise SystemExit("Could not find manifest tag")

              insertion = "\n" + "\n".join(
                  "    " + p for p in missing
              ) + "\n"

              text = text[:marker + 1] + insertion + text[marker + 1:]
              manifest.write_text(text)

          print("Android permissions configured:")

          for permission in permissions:
              name = permission.split('android:name="')[1].split('"')[0]
              print(" - " + name)

          print("\nFinal AndroidManifest.xml:")
          print(manifest.read_text())
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze lib --no-fatal-infos --no-fatal-warnings

      - name: Build APK
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"

      - name: Build AAB
        run: |
          flutter build appbundle --release \
            --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sociam-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: Sociam-AAB
          path: build/app/outputs/bundle/release/app-release.aab
